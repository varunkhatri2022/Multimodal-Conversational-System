<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AxiomCart Request Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: graph on the left, the step story + state on the right, controls underneath. */
:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --ink: #172033;
  --muted: #5d677a;
  --line: #c3cad6;
  --accent: #2563d6;
  --wait: #c46a12;
  --ok: #23845a;
  --accent-soft: #dfe9fb;
  --wait-soft: #fbeedd;
  --bad: #c2362f;
  --bad-soft: #fbe3e1;
  --ok-soft: #dcf1e6;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141c; --panel: #161d28; --ink: #e5eaf2; --muted: #9aa6b8; --line: #364357;
    --accent: #6ea2ff; --wait: #f0a35a; --ok: #4fbf85; --accent-soft: #1d2d4a; --wait-soft: #3a2a18;
    --bad: #ff7b72; --bad-soft: #3d1f1f; --ok-soft: #173426;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141c; --panel: #161d28; --ink: #e5eaf2; --muted: #9aa6b8; --line: #364357;
  --accent: #6ea2ff; --wait: #f0a35a; --ok: #4fbf85; --accent-soft: #1d2d4a; --wait-soft: #3a2a18;
    --bad: #ff7b72; --bad-soft: #3d1f1f; --ok-soft: #173426;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 18px 20px 28px; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 28px; margin: 0; letter-spacing: 0.2px; text-wrap: balance; }
.sub { color: var(--muted); margin: 2px 0 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { font: 500 14px var(--font-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.tab:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.stage { display: grid; grid-template-columns: minmax(0, 2.15fr) minmax(300px, 1fr); gap: 14px; align-items: start; }
.graph { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; overflow-x: auto; }
.graph svg { display: block; width: 100%; min-width: 760px; height: auto; }
.story { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 12px; align-content: start; }
.stepno { font: 500 13px var(--font-mono); color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.lesson { color: var(--accent); }
.story h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 0; text-wrap: balance; }
.story p { margin: 0; }
.code { font: 13px/1.5 var(--font-mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
.log { font: 13px/1.5 var(--font-mono); color: var(--muted); }
.log b { color: var(--ink); font-weight: 500; }
.state h3 { font: 600 13px var(--font-body); text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin: 0 0 6px; }
.state ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.state li { font: 13px/1.45 var(--font-mono); display: grid; grid-template-columns: 118px 1fr; gap: 8px; padding: 4px 6px; border-radius: 5px; }
.state li .k { color: var(--muted); }
.state li .v { word-break: break-word; }
.state li.new { background: var(--accent-soft); }
.state li.wait { background: var(--wait-soft); }
.tag { font: 600 10px var(--font-body); letter-spacing: 0.5px; border-radius: 3px; padding: 1px 4px; margin-left: 6px; vertical-align: 1px; }
li.new .tag { background: var(--accent); color: #fff; }
li.wait .tag { background: var(--wait); color: #fff; }
.state li.bad { background: var(--bad-soft); }
.state li.ok { background: var(--ok-soft); }
li.bad .tag { background: var(--bad); color: #fff; }
li.ok .tag { background: var(--ok); color: #fff; }
.tab-sep { width: 1px; background: var(--line); margin: 2px 4px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.btn { font: 600 14px var(--font-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 8px 16px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: 0.45; cursor: default; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 22px; height: 6px; border-radius: 3px; background: var(--line); border: 0; padding: 0; cursor: pointer; }
.dot.on { background: var(--accent); }
.hint { color: var(--muted); font-size: 13px; margin-left: auto; }

/* SVG graph */
.g-node rect, .g-node circle { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; transition: stroke 0.25s, fill 0.25s; }
.g-node text { fill: var(--ink); font-family: var(--font-body); font-size: 14px; font-weight: 600; text-anchor: middle; }
.g-node text.s { fill: var(--muted); font-size: 11.5px; font-weight: 400; }
.g-node text.m { font-family: var(--font-mono); font-weight: 400; font-size: 11px; fill: var(--muted); }
.g-node.box > rect { stroke-dasharray: 0; }
.g-node.sub > rect { fill: var(--bg); }
.g-node.active > rect, .g-node.active > circle { stroke: var(--accent); stroke-width: 3; }
.g-node.active > rect.inner { stroke-width: 2.5; }
.g-node.waiting > rect { stroke: var(--wait); stroke-width: 3; }
.g-node.dashed > rect { stroke-dasharray: 5 4; }
.g-node.dim { opacity: 0.35; }
.g-node.bad > rect { stroke: var(--bad); stroke-width: 3; fill: var(--bad-soft); }
.g-node.ok > rect { stroke: var(--ok); stroke-width: 3; fill: var(--ok-soft); }
.frame { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
.frame-label { fill: var(--muted); font: 600 12px var(--font-body); letter-spacing: 0.8px; }
.note { fill: var(--muted); font: 12px var(--font-body); }
.note.bad { fill: var(--bad); font-weight: 600; }
.note.ok { fill: var(--ok); font-weight: 600; }
.run rect { fill: var(--bg); stroke: var(--line); }
.run text { fill: var(--muted); font: 600 12px var(--font-mono); text-anchor: middle; }
.run.done rect { fill: var(--accent-soft); stroke: var(--accent); }
.run.on rect { fill: var(--accent); stroke: var(--accent); }
.run.on text { fill: #fff; }
/* the lesson 20/21 graphs have fewer nodes, so their text can be larger */
#svg-l20 .g-node text, #svg-l21 .g-node text { font-size: 17px; }
#svg-l20 .g-node text.s, #svg-l21 .g-node text.s { font-size: 13px; }
#svg-l21 .g-node text.m { font-size: 12.5px; }
#svg-l20 #n-start20 text, #svg-l20 #n-end20 text, #svg-l21 #n-start21 text, #svg-l21 #n-end21 text { font-size: 9.5px; }
#svg-l20 .note, #svg-l21 .note { font-size: 14px; }
#svg-l20 .elabel, #svg-l21 .elabel { font-size: 12.5px; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; marker-end: url(#arrow); transition: stroke 0.25s; }
.edge.lit { stroke: var(--accent); stroke-width: 2.6; marker-end: url(#arrow-lit); }
.edge.int { stroke-dasharray: 6 5; }
.edge.int.lit { stroke: var(--wait); marker-end: url(#arrow-wait); }
.edge.dim { opacity: 0.3; }
.elabel { fill: var(--muted); font: 11px var(--font-mono); text-anchor: middle; }
.pill rect { fill: var(--bg); stroke: var(--line); }
.pill text { fill: var(--muted); font: 600 10.5px var(--font-body); text-anchor: middle; }
.pill.active rect { fill: var(--accent); stroke: var(--accent); }
.pill.active text { fill: #fff; }
.pill.dim { opacity: 0.35; }
.decision rect { fill: var(--accent-soft); stroke: var(--accent); }
.decision text { fill: var(--ink); font: 500 12px var(--font-body); text-anchor: middle; }
.paused text { fill: var(--wait); font: 700 11px var(--font-body); letter-spacing: 0.8px; text-anchor: middle; }
.packet circle { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.packet.wait circle { fill: var(--wait); }
.packet rect { fill: var(--ink); }
.packet text { fill: var(--panel); font: 500 11px var(--font-mono); text-anchor: middle; }
@media (max-width: 1000px) { .stage { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>AxiomCart Request Flow</h1>
      <p class="sub">Follow one customer question through the graph, one step at a time. Tabs 5 and 6: why each agent's loop runs as a subgraph (lessons 20, 21).</p>
    </div>
    <div class="tabs" role="tablist" aria-label="Scenario" id="tabs"></div>
  </header>

  <div class="stage">
    <figure class="graph" style="margin:0">
      <svg id="svg-axiom" class="gsvg" viewBox="0 0 1100 600" role="img" aria-label="AxiomCart graph: the customer's question goes through main.py into the orchestrator, which sends tasks to the product and support agents; each agent runs a model and tools loop; the synthesizer merges the results and the answer goes back to the customer.">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f99aa"/></marker>
          <marker id="arrow-lit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563d6"/></marker>
          <marker id="arrow-wait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c46a12"/></marker>
        </defs>

        <!-- edges -->
        <path class="edge" id="e-q_in" d="M140,278 L250,278"/>
        <path class="edge" id="e-a_out" d="M250,312 L140,312"/>
        <path class="edge" id="e-invoke" d="M370,295 L412,295"/>
        <path class="edge" id="e-start_orch" d="M448,295 L480,295"/>
        <path class="edge" id="e-orch_prod" d="M620,280 C652,280 652,165 690,165 L700,165"/>
        <path class="edge" id="e-orch_supp" d="M620,310 C652,310 652,425 690,425 L700,425"/>
        <path class="edge" id="e-prod_m2t" d="M780,146 L830,146"/>
        <path class="edge" id="e-prod_t2m" d="M830,166 L780,166"/>
        <path class="edge" id="e-supp_m2t" d="M780,406 L830,406"/>
        <path class="edge" id="e-supp_t2m" d="M830,426 L780,426"/>
        <path class="edge" id="e-prod_out" d="M740,180 L740,222 L920,222 C946,222 940,280 960,280"/>
        <path class="edge" id="e-supp_out" d="M740,440 L740,482 L920,482 C946,482 940,310 960,310"/>
        <path class="edge" id="e-synth_end" d="M1020,335 L1020,412"/>
        <path class="edge" id="e-end_main" d="M1020,448 L1020,568 L310,568 L310,335"/>
        <path class="edge int" id="e-interrupt" d="M712,440 L712,535 L340,535 L340,335"/>
        <text class="elabel" x="665" y="583">final_answer goes back to main.py</text>
        <text class="elabel" x="526" y="527">interrupt() / Command(resume=...)</text>
        <text class="elabel" x="652" y="232">Send</text>
        <text class="elabel" x="652" y="372">Send</text>

        <!-- customer -->
        <g class="g-node box" id="n-customer"><rect x="20" y="255" width="120" height="80" rx="8"/><text x="80" y="290">Customer</text><text class="s" x="80" y="308">text or voice</text></g>
        <g class="pill" id="n-stt"><rect x="168" y="268" width="54" height="20" rx="10"/><text x="195" y="282">STT</text></g>
        <g class="pill" id="n-tts"><rect x="168" y="302" width="54" height="20" rx="10"/><text x="195" y="316">TTS</text></g>

        <!-- main.py -->
        <g class="g-node box" id="n-main"><rect x="250" y="255" width="120" height="80" rx="8"/><text x="310" y="290">main.py</text><text class="m" x="310" y="308">query()</text></g>

        <!-- START -->
        <g class="g-node" id="n-start"><circle cx="430" cy="295" r="18"/><text x="430" y="299" style="font-size:9.5px">START</text></g>

        <!-- orchestrator -->
        <g class="g-node box" id="n-orch"><rect x="480" y="255" width="140" height="80" rx="8"/><text x="550" y="290">orchestrator</text><text class="s" x="550" y="308">LLM picks agents</text></g>
        <g class="decision" id="decision" visibility="hidden"><rect id="decision-bg" x="430" y="212" width="240" height="26" rx="13"/><text id="decision-text" x="550" y="229"></text></g>

        <!-- memory -->
        <g class="g-node box dashed" id="n-mem"><rect x="470" y="410" width="160" height="52" rx="8"/><text x="550" y="432" style="font-size:13px">MemorySaver</text><text class="m" x="550" y="449">thread_id: user-1</text></g>

        <!-- product agent (subgraph) -->
        <g class="g-node box" id="n-prod"><rect x="690" y="80" width="230" height="168" rx="10"/><text x="805" y="103">product_agent</text><text class="s" x="805" y="119">subgraph: model and tools loop</text></g>
        <g class="g-node sub" id="n-prod_model"><rect class="inner" x="700" y="130" width="80" height="50" rx="6"/><text x="740" y="160" style="font-size:13px">model</text></g>
        <g class="g-node sub" id="n-prod_tools"><rect class="inner" x="830" y="130" width="80" height="50" rx="6"/><text x="870" y="160" style="font-size:13px">tools</text></g>
        <g class="g-node" id="lbl-prod"><text class="m" x="870" y="200">search_product_catalog</text></g>

        <!-- support agent (subgraph) -->
        <g class="g-node box" id="n-supp"><rect x="690" y="340" width="230" height="168" rx="10"/><text x="805" y="363">support_agent</text><text class="s" x="805" y="379">subgraph: model and tools loop</text></g>
        <g class="g-node sub" id="n-supp_model"><rect class="inner" x="700" y="390" width="80" height="50" rx="6"/><text x="740" y="420" style="font-size:13px">model</text></g>
        <g class="g-node sub" id="n-supp_tools"><rect class="inner" x="830" y="390" width="80" height="50" rx="6"/><text x="870" y="420" style="font-size:13px">tools</text></g>
        <g class="g-node" id="lbl-supp"><text class="m" x="870" y="460">get_order_status</text></g>
        <g class="paused" id="paused" visibility="hidden"><text x="805" y="500">PAUSED: waiting for the customer</text></g>

        <!-- synthesizer + END -->
        <g class="g-node box" id="n-synth"><rect x="960" y="255" width="120" height="80" rx="8"/><text x="1020" y="290">synthesizer</text><text class="s" x="1020" y="308">merges answers</text></g>
        <g class="g-node" id="n-end"><circle cx="1020" cy="430" r="18"/><text x="1020" y="434" style="font-size:9.5px">END</text></g>

        <g class="packets"></g>
      </svg>

      <svg id="svg-l20" class="gsvg" viewBox="0 0 1100 600" role="img" aria-label="Lesson 20 graph: START sends to hotel_agent and trip_agent; trip_agent loops through tool in the main graph; both lead to the synthesizer, then END." style="display:none">
        <g class="run" data-run="1"><rect x="330" y="18" width="110" height="30" rx="15"/><text x="385" y="38">STEP 1</text></g>
        <g class="run" data-run="2"><rect x="460" y="18" width="110" height="30" rx="15"/><text x="515" y="38">STEP 2</text></g>
        <g class="run" data-run="3"><rect x="590" y="18" width="110" height="30" rx="15"/><text x="645" y="38">STEP 3</text></g>
        <g class="run" data-run="4"><rect x="720" y="18" width="110" height="30" rx="15"/><text x="775" y="38">STEP 4</text></g>
        <text class="note" x="316" y="38" text-anchor="end">steps of the main graph:</text>
        <rect class="frame" x="20" y="70" width="1060" height="510" rx="10"/>
        <text class="frame-label" x="40" y="96">MAIN GRAPH: one shared state</text>

        <path class="edge" id="e-a20_start_hotel" d="M110,310 C190,310 190,175 270,175"/>
        <path class="edge" id="e-a20_start_trip" d="M110,310 C190,310 190,415 270,415"/>
        <path class="edge" id="e-a20_hotel_synth" d="M440,175 C620,175 620,295 760,295"/>
        <path class="edge" id="e-a20_trip_synth" d="M440,405 C620,405 620,325 760,325"/>
        <path class="edge" id="e-a20_trip_tool" d="M330,450 L330,500"/>
        <path class="edge" id="e-a20_tool_trip" d="M380,500 L380,450"/>
        <path class="edge" id="e-a20_synth_end" d="M930,310 L988,310"/>
        <text class="elabel" x="214" y="232">Send</text>
        <text class="elabel" x="214" y="398">Send</text>
        <text class="elabel" x="610" y="395">route_trip</text>
        <text class="note bad" x="460" y="532">the tool loop is wired into the MAIN graph</text>

        <g class="g-node" id="n-start20"><circle cx="90" cy="310" r="20"/><text x="90" y="314" style="font-size:9.5px">START</text></g>
        <g class="g-node box" id="n-hotel20"><rect x="270" y="140" width="170" height="70" rx="8"/><text x="355" y="171">hotel_agent</text><text class="s" x="355" y="190">answers right away</text></g>
        <g class="g-node box" id="n-trip20"><rect x="270" y="380" width="170" height="70" rx="8"/><text x="355" y="411">trip_agent</text><text class="s" x="355" y="430">needs a tool first</text></g>
        <g class="g-node box" id="n-tool20"><rect x="270" y="500" width="170" height="56" rx="8"/><text x="355" y="533">tool</text></g>
        <g class="g-node box" id="n-synth20"><rect x="760" y="275" width="170" height="70" rx="8"/><text x="845" y="306">synthesizer</text><text class="s" x="845" y="325">merges results</text></g>
        <g class="g-node" id="n-end20"><circle cx="1010" cy="310" r="20"/><text x="1010" y="314" style="font-size:9.5px">END</text></g>
        <g class="packets"></g>
      </svg>

      <svg id="svg-l21" class="gsvg" viewBox="0 0 1100 600" role="img" aria-label="Lesson 21 graph: START sends to hotel_agent and trip_agent; trip_agent runs its think and tool loop inside a private subgraph; a join edge waits for both agents before the synthesizer, then END." style="display:none">
        <g class="run" data-run="1"><rect x="330" y="18" width="110" height="30" rx="15"/><text x="385" y="38">STEP 1</text></g>
        <g class="run" data-run="2"><rect x="460" y="18" width="110" height="30" rx="15"/><text x="515" y="38">STEP 2</text></g>
        <text class="note" x="316" y="38" text-anchor="end">steps of the main graph:</text>
        <text class="note" x="590" y="38">(lesson 20 needed 4)</text>
        <rect class="frame" x="20" y="70" width="1060" height="510" rx="10"/>
        <text class="frame-label" x="40" y="96">MAIN GRAPH: one shared state</text>

        <path class="edge" id="e-a21_start_hotel" d="M110,310 C190,310 190,175 270,175"/>
        <path class="edge" id="e-a21_start_trip" d="M110,310 C190,310 190,440 270,440"/>
        <path class="edge" id="e-a21_hotel_synth" d="M440,175 C620,175 640,295 760,295"/>
        <path class="edge" id="e-a21_trip_synth" d="M600,440 C690,440 690,325 760,325"/>
        <path class="edge" id="e-a21_think_tool" d="M400,420 L470,420"/>
        <path class="edge" id="e-a21_tool_think" d="M470,440 L400,440"/>
        <path class="edge" id="e-a21_synth_end" d="M930,310 L988,310"/>
        <text class="elabel" x="214" y="232">Send</text>
        <text class="elabel" x="214" y="410">Send</text>
        <text class="note" x="845" y="262" text-anchor="middle">join: waits for both agents</text>

        <g class="g-node" id="n-start21"><circle cx="90" cy="310" r="20"/><text x="90" y="314" style="font-size:9.5px">START</text></g>
        <g class="g-node box" id="n-hotel21"><rect x="270" y="140" width="170" height="70" rx="8"/><text x="355" y="171">hotel_agent</text><text class="s" x="355" y="190">answers right away</text></g>

// ---- Rendering --------------------------------------------------------------
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAGS = { new: "CHANGED", wait: "WAITING", bad: "PROBLEM", ok: "FIXED" };
let sc = 0, step = 0, runId = 0, playTimer = null;

function el(tag, attrs, parent) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const a in attrs) n.setAttribute(a, attrs[a]);
  if (parent) parent.appendChild(n);
  return n;
}

function makePacket(parent, label, wait) {
  const g = el("g", { class: "packet" + (wait ? " wait" : "") }, parent);
  el("circle", { r: 8 }, g);
  if (label) {
    const w = label.length * 6.7 + 12;
    el("rect", { x: -w / 2, y: -30, width: w, height: 18, rx: 4 }, g);
    const t = el("text", { x: 0, y: -17 }, g);
    t.textContent = label;
  }
  return g;
}

function place(g, path, frac) {
  const len = path.getTotalLength();
  const p = path.getPointAtLength(Math.max(0, Math.min(1, frac)) * len);
  g.setAttribute("transform", `translate(${p.x},${p.y})`);
}

function animate(anim, parent, myRun, live) {
  const path = document.getElementById("e-" + anim.e);
  const g = makePacket(parent, anim.label, anim.wait);
  const from = anim.rev ? 1 : 0, to = anim.rev ? 0 : 1;
  if (!live) { place(g, path, to); return; }
  place(g, path, from);
  g.style.visibility = "hidden";
  const dur = 1100;
  setTimeout(() => {
    if (myRun !== runId) return;
    g.style.visibility = "visible";
    const t0 = performance.now();
    function tick(now) {
      if (myRun !== runId) return;
      let k = Math.min(1, (now - t0) / dur);
      k = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;   // ease in-out
      place(g, path, from + (to - from) * k);
      if (k < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }, anim.d || 0);
}

function fillList(ul, rows) {
  ul.replaceChildren();
  for (const row of rows) {
    const li = document.createElement("li");
    if (row.tag) li.className = row.tag;
    const k = document.createElement("span"); k.className = "k"; k.textContent = row.k;
    const v = document.createElement("span"); v.className = "v"; v.textContent = row.v;
    if (row.tag) { const t = document.createElement("span"); t.className = "tag"; t.textContent = TAGS[row.tag]; v.appendChild(t); }
    li.append(k, v); ul.appendChild(li);
  }
}

function render(live) {
  runId++;
  const S = SCENARIOS[sc], s = S.steps[step];
  const graphId = S.graph || "axiom";
  // show the graph this scenario uses
  document.querySelectorAll(".gsvg").forEach(g => { g.style.display = g.id === "svg-" + graphId ? "" : "none"; });
  const svg = document.getElementById("svg-" + graphId);
  // nodes
  svg.querySelectorAll('.g-node[id^="n-"]').forEach(n => {
    const id = n.id.slice(2);
    n.classList.toggle("active", (s.on || []).includes(id));
    n.classList.toggle("waiting", (s.waiting || []).includes(id));
    n.classList.toggle("bad", (s.bad || []).includes(id));
    n.classList.toggle("ok", (s.ok || []).includes(id));
  });
  // edges
  const used = new Set((s.anims || []).map(a => a.e));
  svg.querySelectorAll(".edge").forEach(p => p.classList.toggle("lit", used.has(p.id.slice(2))));
  // main-graph steps (STEP 1, STEP 2, ...) for the lesson graphs
  svg.querySelectorAll(".run").forEach(r => {
    const n = Number(r.dataset.run);
    r.classList.toggle("on", n === s.run);
    r.classList.toggle("done", n < s.run);
  });
  if (graphId === "axiom") {
    for (const id of ["stt", "tts"]) {
      const n = document.getElementById("n-" + id);
      n.classList.toggle("dim", !S.voice);
      n.classList.toggle("active", (s.on || []).includes(id));
    }
    document.getElementById("paused").setAttribute("visibility", s.paused ? "visible" : "hidden");
    const dec = document.getElementById("decision");
    if (s.decision) {
      const t = document.getElementById("decision-text");
      t.textContent = s.decision;
      const w = s.decision.length * 6.6 + 28;
      const r = document.getElementById("decision-bg");
      r.setAttribute("width", w); r.setAttribute("x", 550 - w / 2);
      dec.setAttribute("visibility", "visible");
    } else dec.setAttribute("visibility", "hidden");
  }
  // packets
  const packetsG = svg.querySelector(".packets");
  packetsG.replaceChildren();
  const myRun = runId;
  (s.anims || []).forEach(a => animate(a, packetsG, myRun, live && !reduce));
  // story
  document.getElementById("stepno").textContent = `${S.name}  |  slide ${step + 1} of ${S.steps.length}`;
  document.getElementById("lesson").textContent = s.lesson || "";
  document.getElementById("title").textContent = s.title;
  document.getElementById("text").textContent = s.text;
  const code = document.getElementById("code");
  code.textContent = s.code || ""; code.style.display = s.code ? "" : "none";
  const log = document.getElementById("log");
  log.innerHTML = s.log ? (S.graph ? "output: " : "log: ") + s.log : ""; log.style.display = s.log ? "" : "none";
  fillList(document.getElementById("state"), s.state);
  const extraWrap = document.getElementById("extra-wrap");
  if (s.extra) {
    document.getElementById("extra-title").textContent = s.extra.title;
    fillList(document.getElementById("extra"), s.extra.rows);
    extraWrap.style.display = "";
  } else extraWrap.style.display = "none";
  // controls
  document.getElementById("prev").disabled = step === 0;
  document.getElementById("next").disabled = step === S.steps.length - 1;
  const dots = document.getElementById("dots");
  dots.replaceChildren();
  S.steps.forEach((_, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "dot" + (i <= step ? " on" : "");
    b.setAttribute("aria-label", `Step ${i + 1}`);
    b.addEventListener("click", () => { stopPlay(); step = i; render(true); });
    dots.appendChild(b);
  });
  document.querySelectorAll(".tab").forEach((t, i) => t.setAttribute("aria-selected", i === sc ? "true" : "false"));
}

function next() { const S = SCENARIOS[sc]; if (step < S.steps.length - 1) { step++; render(true); } else stopPlay(); }
function prev() { stopPlay(); if (step > 0) { step--; render(false); } }
function setScenario(i) { stopPlay(); sc = i; step = 0; render(true); }
function stopPlay() { if (playTimer) { clearInterval(playTimer); playTimer = null; document.getElementById("play").textContent = "Play"; } }
function togglePlay() {
  if (playTimer) return stopPlay();
  document.getElementById("play").textContent = "Pause";
  if (step === SCENARIOS[sc].steps.length - 1) { step = 0; render(true); }
  playTimer = setInterval(next, 3200);
}

// tabs (a thin divider separates the AxiomCart scenarios from the lesson 20/21 pair)
const tabs = document.getElementById("tabs");
SCENARIOS.forEach((S, i) => {
  if (S.graph && !SCENARIOS[i - 1].graph) {
    const sep = document.createElement("span"); sep.className = "tab-sep"; sep.setAttribute("aria-hidden", "true");
    tabs.appendChild(sep);
  }
  const b = document.createElement("button");
  b.type = "button"; b.className = "tab"; b.setAttribute("role", "tab"); b.id = "tab-" + S.id;
  b.textContent = S.name; b.title = S.query;
  b.addEventListener("click", () => setScenario(i));
  tabs.appendChild(b);
});
document.getElementById("next").addEventListener("click", () => { stopPlay(); next(); });
document.getElementById("prev").addEventListener("click", prev);
document.getElementById("restart").addEventListener("click", () => { stopPlay(); step = 0; render(true); });
document.getElementById("play").addEventListener("click", togglePlay);
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); stopPlay(); next(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
  else if (["1", "2", "3", "4", "5", "6"].includes(e.key)) setScenario(Number(e.key) - 1);
});

// Start on the two-agent scenario at rest, so the first frame shows the most interesting picture.
sc = 2; step = 0; render(false);
</script>
